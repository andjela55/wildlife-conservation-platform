<div class="app-shell" [class.sidebar-collapsed]="isSidebarCollapsed">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="assets/logo/logo_light-blank.svg" alt="WildTrack" />
      <span class="brand-text">
        <strong>WildTrack</strong>
      </span>
      <button
        class="collapse-button"
        [class.is-collapsed]="isSidebarCollapsed"
        type="button"
        [attr.aria-label]="isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        (click)="toggleSidebar()"
      ></button>
    </div>

    <nav class="nav-list" aria-label="Primary navigation">
      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact === true }"
        [attr.title]="isSidebarCollapsed ? item.label : null"
      >
        <img class="nav-icon" [src]="item.icon" alt="" />
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-note">
      <div class="ranger-avatar">RA</div>
      <div>
        <strong>Ranger Alex</strong>
        <span>Field Ranger</span>
      </div>
    </div>
  </aside>

  <main class="workspace">
    <div class="content-surface">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
