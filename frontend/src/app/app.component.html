<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="assets/wildtrack-mark.svg" alt="" />
      <span>
        <strong>WildTrack</strong>
        <small>Conservation Platform</small>
      </span>
    </div>

    <nav class="nav-list" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span></span>Dashboard</a>
      <a routerLink="/species" routerLinkActive="active"><span></span>Species</a>
      <a routerLink="/animals" routerLinkActive="active"><span></span>Animals</a>
      <a routerLink="/collars" routerLinkActive="active"><span></span>Collars</a>
      <a routerLink="/reports" routerLinkActive="active"><span></span>Reports</a>
      <a routerLink="/alerts" routerLinkActive="active"><span></span>Alerts</a>
    </nav>

    <div class="sidebar-note">
      <span>Field Network</span>
      <strong>Calm monitoring for protected habitats</strong>
    </div>
  </aside>

  <main class="workspace">
    <div class="topbar">
      <label class="search-shell">
        <span>Search</span>
        <input type="search" placeholder="Animals, collars, reports..." />
      </label>
      <div class="status-chip">Live habitat data</div>
    </div>

    <div class="content-surface">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
